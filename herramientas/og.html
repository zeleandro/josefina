<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#F6E7DA;font-family:'Cormorant Garamond',Georgia,serif;color:#5B4A3B;overflow:hidden}
  .marco{position:absolute;inset:18px;border:1.5px solid #C9A66B;border-radius:10px}
  .marco2{position:absolute;inset:26px;border:1px solid rgba(168,123,60,.34);border-radius:6px}
  .fila{display:flex;align-items:center;height:100%;padding:0 54px 0 20px;gap:10px}
  .ilus{width:520px;flex:none}
  .ilus img{width:100%;display:block}
  .texto{flex:1;text-align:center;padding-bottom:10px}
  .intro{font-size:27px;letter-spacing:.06em;color:#7C6957}
  .t{font-family:'Great Vibes',cursive;font-size:104px;line-height:.92;color:#A87B3C;margin-top:2px}
  .de{font-size:29px;color:#7C6957;margin-top:2px}
  .n{font-family:'Great Vibes',cursive;font-size:126px;line-height:.95;color:#C9908C;margin-top:-4px}
  .regla{width:210px;height:1px;background:#C9A66B;margin:22px auto 16px}
  .fecha{font-variant-numeric:lining-nums;font-size:27px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:#8A6430}
  .esq{position:absolute;width:150px}
  .esq.a{top:0;left:0}.esq.b{bottom:0;right:0;transform:scale(-1)}
</style>
<div class="marco"></div><div class="marco2"></div>
<img class="esq a" src="../assets/esquina.png"><img class="esq b" src="../assets/esquina.png">
<div class="fila">
  <div class="ilus"><img src="../assets/ilustracion.jpg"></div>
  <div class="texto">
    <div class="intro">Te invitamos a celebrar el</div>
    <div class="t">Bautismo</div>
    <div class="de">de</div>
    <div class="n">Josefina</div>
    <div class="regla"></div>
    <div class="fecha">24 de octubre de 2026</div>
  </div>
</div>
