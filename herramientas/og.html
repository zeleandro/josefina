<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#F6E9DD;font-family:'Cormorant Garamond',Georgia,serif;color:#5B4A3B;overflow:hidden}
  .marco{position:absolute;inset:20px;border:2px solid #E9B3A6;border-radius:12px}
  .fila{display:flex;align-items:center;height:100%;padding:0 58px 0 34px;gap:16px}
  .ilus{width:540px;flex:none}
  .ilus img{width:100%;display:block}
  .texto{flex:1;text-align:center;padding-bottom:8px}
  .mi{font-family:'Great Vibes',cursive;font-size:52px;line-height:1;color:#A87B3C}
  .t{font-family:'Great Vibes',cursive;font-size:108px;line-height:.95;color:#A87B3C;margin-top:-8px}
  .n{font-family:'Great Vibes',cursive;font-size:124px;line-height:.95;color:#C9908C;margin-top:6px}
  .regla{width:210px;height:1px;background:#E9B3A6;margin:26px auto 16px}
  .fecha{font-variant-numeric:lining-nums;font-size:27px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:#7A5729}
  .esq{position:absolute;width:170px}
  .esq.a{top:0;left:0}.esq.b{bottom:0;right:0;transform:scale(-1)}
</style>
<div class="marco"></div>
<img class="esq a" src="../assets/esquina.png"><img class="esq b" src="../assets/esquina.png">
<div class="fila">
  <div class="ilus"><img src="../assets/ilustracion.jpg"></div>
  <div class="texto">
    <div class="mi">Mi</div>
    <div class="t">Bautismo</div>
    <div class="n">Josefina</div>
    <div class="regla"></div>
    <div class="fecha">24 de octubre de 2026</div>
  </div>
</div>
